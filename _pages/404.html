<!DOCTYPE html>
<!--
  GitHub Pages serves this page for any address that doesn't exist (e.g. /f or /files/).
  It sends the visitor straight to the homepage. The HTTP status stays 404, so search
  engines still drop dead links.
-->
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ site.author.name }}</title>
  <link rel="icon" href="/images/favicon_umich.ico" sizes="16x16 32x32">
  <meta http-equiv="refresh" content="0; url=/">
  <script>location.replace("/");</script>
</head>
<body>
  <p>Page not found. <a href="/">Go to the homepage</a>.</p>
</body>
</html>
